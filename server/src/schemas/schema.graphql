type Query {
  jobs(limit: Int, offset: Int): JobList!
  job(id: ID!): Job
  company(id: ID!): Company
  candidate(id: ID!): Candidate
  response(id: ID!): Response
  responses: [Response!]!
}

type Mutation {
  createJob(input: JobCreateInput!): Job
  createCompany(input: CompanyCreateInput!): Company
  createCandidate(input: CandidateCreateInput!): Candidate
  addSavedJob(candidateId: ID!, jobId: ID!): [ID!]
  removeSavedJob(candidateId: ID!, jobId: ID!): [ID!]
  deleteJob(id: ID!, companyId: ID!): Job
  updateJob(id: ID!, companyId: ID!, input: JobCreateInput!): Job
  addResponse(jobId: ID!, text: String!): Response
}

type Subscription {
  responseAdded: Response
}

"""
Types for candidate
"""
type Candidate {
  id: ID!
  name: String!
  email: String!
  years: Int!
  englishLevel: String!
  experience: String!
  savedJobs: JobList!
}

input CandidateCreateInput {
  name: String!
  email: String!
  years: Int!
  englishLevel: String!
  password: String!
  experience: String!
}

"""
Types for company
"""
type Company {
  id: ID!
  email: String!
  dateCreated: String!
  name: String!
  description: String
  country: String!
  jobs(limit: Int, offset: Int): JobList!
  employees: Int!
}

input CompanyCreateInput {
  name: String!
  email: String!
  country: String!
  password: String!
  employees: Int!
  description: String
}

"""
Types for job
"""
type Job {
  id: ID!
  title: String!
  company: Company!
  dateCreated: String!
  description: String
  responses: [String!]!
  country: String!
  type: JobType!
  requirements: JobRequirements
}

type JobList {
  items: [Job!]!
  totalCount: Int!
}

type JobRequirements {
  years: Int!
  englishLevel: String!
}

input JobRequirementsInput {
  years: Int!
  englishLevel: String!
}

enum JobType {
  Office
  Remote
}

type Response {
  id: ID!
  dateCreated: String!
  job: Job!
  company: Company!
  candidate: Candidate!
  message: String!
}

"""
Arguments for creating job
"""
input JobCreateInput {
  title: String!
  description: String
  type: JobType
  requirements: JobRequirementsInput
}


